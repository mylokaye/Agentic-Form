<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Verification Form</title>

  <style>
    /* 1. Design tokens */
    :root {
      --color-bg: #f6f8fb;
      --color-surface: #ffffff;
      --color-text: #333333;
      --color-muted: #777777;
      --color-border: #d0d5dd;
      --color-primary: #005eb8;
      --color-primary-hover: #004a94;
      --color-button-muted: #d1d7e1;
      --color-button-muted-border: #bac2ce;
      --color-button-muted-hover: #667085;
      --color-error: #b42318;
      --color-focus: #7cc4ff;
      --color-green: #00B77D;
      --color-progress: var(--color-green);
      --color-progress-soft: var(--color-green);
      --color-success: var(--color-green);
      --color-badge-bg: var(--color-green);
      --color-badge-text: #ffffff;
      --color-switch-track: #0077e6;

      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-button: 10px;

      --font-family: "Inter", Arial, Helvetica, sans-serif;
      --font-size-body: 14px;
      --line-height-body: 20px;
      --font-size-title: 16px;
      --line-height-title: 20px;
      --font-size-label: 13px;
      --line-height-label: 16px;
      --font-weight-regular: 400;
      --font-weight-medium: 500;

      --height-button: 50px;
      --height-data-row: 40px;
      --height-store-row: 44px;
      --height-badge: 20px;
      --height-switch: 14px;
      --width-switch: 24px;
      --size-switch-thumb: 10px;

      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
    }

    /* 2. Reset / base styles */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-family);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-regular);
      line-height: var(--line-height-body);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    /* 3. Layout */
    .page-shell {
      width: 100%;
      max-width: 40.8rem;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-md);
    }

    .form-shell {
      display: grid;
      gap: var(--space-sm);
      padding: var(--space-lg);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .progress {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-lg);
      margin: var(--space-lg) 0 0;
      padding: 0;
      list-style: none;
    }

    .progress__item {
      position: relative;
      display: grid;
      align-items: start;
      justify-items: center;
      min-width: 0;
      color: var(--color-muted);
      text-align: center;
    }

    .progress__marker {
      display: inline-grid;
      width: 1.75rem;
      height: 1.75rem;
      place-items: center;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-muted);
      font-size: 0.875rem;
      font-weight: 700;
      line-height: 1;
    }

    .progress__marker svg {
      width: 1rem;
      height: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 3;
    }

    .progress__item[aria-current="step"] .progress__marker {
      border-color: var(--color-progress);
      background: var(--color-progress);
      color: var(--color-surface);
      box-shadow: 0 0 0 0.25rem var(--color-progress-soft);
    }

    .progress__item.is-complete .progress__marker {
      border-color: var(--color-success);
      background: var(--color-success);
      color: var(--color-surface);
    }

    .progress__item.is-complete::after,
    .progress__item[aria-current="step"]::after {
      background: var(--color-progress);
    }

    .progress__item::before {
      position: absolute;
      top: 0.875rem;
      right: calc(50% + 1.25rem);
      left: calc(-50% + 1.25rem);
      height: 2px;
      background: var(--color-border);
      content: "";
    }

    .progress__item::after {
      position: absolute;
      top: 0.875rem;
      right: calc(50% + 1.25rem);
      left: calc(-50% + 1.25rem);
      height: 2px;
      background: transparent;
      content: "";
    }

    .progress__item:first-child::before,
    .progress__item:first-child::after {
      display: none;
    }

    /* 4. Form components */
    .form {
      display: grid;
      gap: var(--space-lg);
    }

    .form__section {
      display: grid;
      gap: var(--space-lg);
    }

    .form__section[hidden] {
      display: none;
    }

    .form-page[hidden] {
      display: none;
    }

    .form-page {
      display: grid;
      gap: var(--space-lg);
    }

    .form__section-title {
      grid-column: 1 / -1;
      margin: 0;
      color: var(--color-text);
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-title);
    }

    .form__section-title[hidden] {
      display: none;
    }

    .form__section--full-width {
      grid-column: 1 / -1;
    }

    .form__field {
      position: relative;
      display: grid;
    }

    .form__control {
      position: relative;
    }

    .form__label {
      position: absolute;
      top: 0.55rem;
      left: 0.75rem;
      z-index: 1;
      max-width: calc(100% - 1.5rem);
      overflow: hidden;
      color: var(--color-text);
      font-size: var(--font-size-label);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-label);
      pointer-events: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .form__field:focus-within .form__label {
      color: var(--color-primary);
    }

    .form__input {
      width: 100%;
      min-height: 4.25rem;
      padding: 1.85rem 0.75rem 0.65rem;
      resize: vertical;
      color: var(--color-text);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }

    .form__input.is-valid {
      border-width: 2px;
      border-color: var(--color-success);
    }

    .form__input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-focus);
      outline: none;
    }

    .form .form__input:focus {
      border-color: var(--color-primary);
    }

    textarea.form__input {
      min-height: 7.5rem;
      line-height: 1.45;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* 5. Buttons */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: var(--height-button);
      padding: 0 0.75rem;
      color: #ffffff;
      font-size: var(--font-size-label);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-label);
      text-align: center;
      background: var(--color-button-muted);
      border: 1px solid var(--color-button-muted-border);
      border-radius: var(--radius-button);
      cursor: pointer;
    }

    .button[hidden] {
      display: none;
    }

    .button:hover {
      background: var(--color-button-muted-hover);
      border-color: var(--color-button-muted-hover);
    }

    .button--ready {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }

    .button--ready:hover {
      background: var(--color-primary-hover);
      border-color: var(--color-primary-hover);
    }

    .button--secondary {
      background: var(--color-button-muted);
      border-color: var(--color-button-muted-border);
    }

    .button--secondary:hover {
      background: var(--color-button-muted-hover);
      border-color: var(--color-button-muted-hover);
    }

    .button:focus {
      box-shadow: 0 0 0 3px var(--color-focus);
      outline: none;
    }

    .button:disabled {
      cursor: wait;
      opacity: 0.85;
    }

    /* 6. Messages and validation */
    .form__message {
      min-height: 1.25rem;
      margin: calc(var(--space-md) * -1) 0 0;
      color: var(--color-muted);
      font-size: 0.9375rem;
    }

    .form:not(.form--inquiry) .form__message:empty {
      display: none;
    }

    .form__message--error {
      color: var(--color-error);
    }

    .form__actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      justify-content: space-between;
    }

    .form__actions .button {
      width: 100%;
    }

    .form__actions .button:last-child {
      margin-left: 0;
      width: 100%;
    }

    .form__actions.is-final .button:last-child {
      width: 100%;
    }

    .form__actions.is-final #verify-button,
    .form__actions.is-final #verify-button:hover {
      background: var(--color-green);
      border-color: var(--color-green);
    }

    .form__actions .button--secondary {
      font-weight: var(--font-weight-medium);
    }

    /* Shared data-display components */
    .row {
      display: flex;
      align-items: center;
      min-width: 0;
      color: var(--color-text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-regular);
      line-height: var(--line-height-body);
    }

    .row--data {
      min-height: var(--height-data-row);
    }

    .row--store {
      min-height: var(--height-store-row);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: var(--height-badge);
      padding: 0 var(--space-sm);
      color: var(--color-badge-text);
      background: var(--color-badge-bg);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-label);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-label);
      white-space: nowrap;
    }

    .switch {
      position: relative;
      display: inline-flex;
      flex: 0 0 auto;
      width: var(--width-switch);
      height: var(--height-switch);
    }

    .switch__input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .switch__track {
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 2px;
      background: var(--color-border);
      border-radius: 999px;
      transition: background-color 150ms ease;
    }

    .switch__thumb {
      width: var(--size-switch-thumb);
      height: var(--size-switch-thumb);
      background: var(--color-surface);
      border-radius: 50%;
      box-shadow: var(--shadow-sm);
      transition: transform 150ms ease;
    }

    .switch__input:checked + .switch__track {
      background: var(--color-switch-track);
    }

    .switch__input:checked + .switch__track .switch__thumb {
      transform: translateX(10px);
    }

    .switch__input:focus-visible + .switch__track {
      box-shadow: 0 0 0 3px var(--color-focus);
    }

    /* 7. Responsive rules */
    @media (min-width: 48rem) {
      .page-shell {
        padding-top: 4rem;
      }

      .form__section--two-columns {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .form__section--three-columns {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .form__actions {
        flex-direction: row;
      }

      .form__actions .button {
        width: calc((100% - (var(--space-md) * 2)) / 3);
      }

      .form__actions:not(.is-final) #verify-button {
        margin-left: auto;
        width: 10.9375rem;
      }

      .form__actions .button--secondary {
        width: 6.25rem;
      }

      .form__actions.is-final .button:last-child {
        width: 100%;
      }

    }
  </style>


</head>
<body>
  <main class="page-shell">
    <section class="form-shell">
      <form class="form form--inquiry" novalidate>
        <div class="form-page" id="page-1">
          <h2 class="form__section-title" data-review-title hidden>Confirm your inquiry</h2>

          <div class="form__field">
            <label class="form__label" for="message">Inquiry</label>
            <textarea
              class="form__input"
              id="message"
              name="message"
              rows="3"
              placeholder="How can we help you today?"
            ></textarea>
          </div>

          <div class="form__field">
            <label class="form__label" for="email">Email address</label>
            <div class="form__control">
              <input
                class="form__input"
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                inputmode="email"
                value="mylo.kaye@google.com"
                aria-describedby="email-validation-status"
                aria-invalid="false"
              >
            </div>
            <span id="email-validation-status" class="visually-hidden" aria-live="polite"></span>
          </div>
        </div>

        <p class="form__message" id="form-message" aria-live="polite"></p>

        <div class="form-page form__section form__section--three-columns" id="verified-fields" hidden>
          <h2 class="form__section-title">Personal details</h2>

          <div class="form__field">
            <label class="form__label" for="first-name">First name</label>
            <input
              class="form__input"
              id="first-name"
              name="firstName"
              type="text"
              autocomplete="given-name"
            >
          </div>

          <div class="form__field">
            <label class="form__label" for="last-name">Last name</label>
            <input
              class="form__input"
              id="last-name"
              name="lastName"
              type="text"
              autocomplete="family-name"
            >
          </div>

          <div class="form__field">
            <label class="form__label" for="phone">Phone number</label>
            <input
              class="form__input"
              id="phone"
              name="phone"
              type="tel"
              autocomplete="tel"
              inputmode="tel"
            >
          </div>

          <div class="form__field">
            <label class="form__label" for="role">Role</label>
            <select
              class="form__input"
              id="role"
              name="role"
            >
              <option value="Manager" selected>Manager</option>
              <option value="Assistant">Assistant</option>
            </select>
          </div>

          <div class="form__field">
            <label class="form__label" for="website">Website</label>
            <input
              class="form__input"
              id="website"
              name="website"
              type="url"
              autocomplete="url"
            >
          </div>

          <div class="form__field">
            <label class="form__label" for="company-name">Company name</label>
            <input
              class="form__input"
              id="company-name"
              name="companyName"
              type="text"
              autocomplete="organization"
            >
          </div>
        </div>

        <div class="form__actions">
          <button
            class="button button--secondary"
            type="button"
            id="back-button"
            hidden
          >
            Back
          </button>
          <button
            class="button"
            type="button"
            id="verify-button"
            aria-controls="page-1 verified-fields enriched-fields"
            aria-expanded="false"
          >
            Continue
          </button>
        </div>

        <div class="form-page form__section form__section--two-columns" id="enriched-fields" hidden>
          <h2 class="form__section-title">Hidden</h2>

          <div class="form__field form__section--full-width">
            <label class="form__label" for="about">About</label>
            <textarea
              class="form__input"
              id="about"
              name="about"
              rows="4"
            ></textarea>
          </div>

          <div class="form__field">
            <label class="form__label" for="urgency">Urgency</label>
            <input
              class="form__input"
              id="urgency"
              name="urgency"
              type="text"
              autocomplete="off"
            >
          </div>

          <div class="form__field">
            <label class="form__label" for="sentiment">Sentiment</label>
            <input
              class="form__input"
              id="sentiment"
              name="sentiment"
              type="text"
              autocomplete="off"
            >
          </div>

          <div class="form__field">
            <label class="form__label" for="query">Query</label>
            <input
              class="form__input"
              id="query"
              name="query"
              type="text"
              autocomplete="off"
            >
          </div>

          <div class="form__field">
            <label class="form__label" for="industry">Industry</label>
            <input
              class="form__input"
              id="industry"
              name="industry"
              type="text"
              autocomplete="off"
            >
          </div>
        </div>
      </form>

    </section>

    <ol class="progress" aria-label="Form progress">
      <li class="progress__item" data-progress-step="1" aria-current="step">
        <span class="progress__marker" aria-hidden="true">1</span>
      </li>
      <li class="progress__item" data-progress-step="2">
        <span class="progress__marker" aria-hidden="true">2</span>
      </li>
      <li class="progress__item" data-progress-step="3">
        <span class="progress__marker" aria-hidden="true">3</span>
      </li>
    </ol>
  </main>

  <script>
    // 1. DOM references
    const emailField = document.getElementById("email");
    const form = document.querySelector(".form");
    const validationStatus = document.getElementById("email-validation-status");
    const pageOne = document.getElementById("page-1");
    const progressSteps = document.querySelectorAll("[data-progress-step]");
    const reviewTitles = document.querySelectorAll("[data-review-title]");
    const backButton = document.getElementById("back-button");
    const verifyButton = document.getElementById("verify-button");
    const formActions = document.querySelector(".form__actions");
    const verifiedFields = document.getElementById("verified-fields");
    const firstNameField = document.getElementById("first-name");
    const lastNameField = document.getElementById("last-name");
    const phoneField = document.getElementById("phone");
    const websiteField = document.getElementById("website");
    const companyNameField = document.getElementById("company-name");
    const enrichedFields = document.getElementById("enriched-fields");
    const industryField = document.getElementById("industry");
    const roleField = document.getElementById("role");
    const aboutField = document.getElementById("about");
    const messageField = document.getElementById("message");
    const urgencyField = document.getElementById("urgency");
    const sentimentField = document.getElementById("sentiment");
    const queryField = document.getElementById("query");
    const formMessage = document.getElementById("form-message");

    // 2. Configuration
    const COMPANY_ENRICHMENT_ENDPOINT = "http://127.0.0.1:8787/enrich-company";
    const COMPANY_ENRICHMENT_TIMEOUT_MS = 20000;
    const FIELD_CONFIG = {
      email: { field: emailField, tracksStatus: true },
      message: { field: messageField, tracksStatus: true },
      firstName: { field: firstNameField, tracksStatus: true, detail: true },
      lastName: { field: lastNameField, tracksStatus: true, detail: true },
      phone: { field: phoneField, tracksStatus: true, detail: true },
      role: { field: roleField, tracksStatus: true, detail: true },
      website: { field: websiteField, tracksStatus: true, detail: true },
      companyName: { field: companyNameField, tracksStatus: true, detail: true },
      industry: { field: industryField, enrichment: true, resetWhenEmailChanges: true },
      about: { field: aboutField, enrichment: true, resetWhenEmailChanges: true },
      urgency: { field: urgencyField, enrichment: true, resetWhenEmailChanges: true },
      sentiment: { field: sentimentField, enrichment: true, resetWhenEmailChanges: true },
      query: { field: queryField, enrichment: true, resetWhenEmailChanges: true }
    };
    const STATUS_FIELDS = Object.values(FIELD_CONFIG)
      .filter(({ field, tracksStatus }) => field && tracksStatus)
      .map(({ field }) => field);
    const DETAIL_FIELDS = Object.values(FIELD_CONFIG)
      .filter(({ field, detail }) => field && detail)
      .map(({ field }) => field);
    const ENRICHMENT_FIELD_NAMES = Object.entries(FIELD_CONFIG)
      .filter(([, { enrichment }]) => enrichment)
      .map(([name]) => name);
    const RESET_FIELD_NAMES = Object.entries(FIELD_CONFIG)
      .filter(([, { resetWhenEmailChanges }]) => resetWhenEmailChanges)
      .map(([name]) => name);
    const formState = {
      currentPage: 1,
      enrichmentController: null,
      enrichmentRequestId: 0,
      isEnrichmentLoading: false
    };

    // 3. Utility functions
    function capitaliseWord(value) {
      if (!value) return "";

      return value.charAt(0).toUpperCase() + value.slice(1).toLowerCase();
    }

    function createIconPath(d) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");

      path.setAttribute("d", d);

      return path;
    }

    function createIcon(paths) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");

      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("focusable", "false");
      paths.forEach((path) => svg.appendChild(createIconPath(path)));

      return svg;
    }

    function updateFieldStatus(field) {
      if (!field) return;

      const hasValue = field === emailField
        ? isValidEmail(field.value)
        : Boolean(getFieldValue(field));

      field.classList.toggle("is-valid", hasValue);
    }

    function updateFieldStatuses() {
      STATUS_FIELDS.forEach(updateFieldStatus);
    }

    // 4. Validation functions
    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());
    }

    function getEmailParts(value) {
      const trimmedValue = value.trim();
      const atIndex = trimmedValue.indexOf("@");

      if (atIndex === -1) {
        return {
          localPart: "",
          domain: ""
        };
      }

      return {
        localPart: trimmedValue.slice(0, atIndex),
        domain: trimmedValue.slice(atIndex + 1).toLowerCase()
      };
    }

    function getNameParts(localPart) {
      // Auto-fill is heuristic until a real verification data source is connected.
      const parts = localPart
        .split(/[._-]+/)
        .map((part) => part.replace(/[^a-zA-Z]/g, ""))
        .filter(Boolean);

      return {
        firstName: capitaliseWord(parts[0] || ""),
        lastName: capitaliseWord(parts.slice(1).join(" "))
      };
    }

    function getCompanyName(domain) {
      const hostName = domain
        .replace(/^www\./, "")
        .split(".")[0] || "";

      return hostName
        .split(/[-_]+/)
        .filter(Boolean)
        .map(capitaliseWord)
        .join(" ");
    }

    function getFieldValue(field) {
      return field ? field.value.trim() : "";
    }

    function getWebsiteUrl(value) {
      const trimmedValue = value.trim();

      if (!trimmedValue) return "";

      return /^https?:\/\//i.test(trimmedValue)
        ? trimmedValue
        : `https://${trimmedValue}`;
    }

    function hasVerifiedFieldEntries() {
      return [firstNameField, lastNameField, websiteField, companyNameField]
        .every((field) => getFieldValue(field));
    }

    function getEnrichmentSnapshot(companyUrl) {
      return {
        email: getFieldValue(emailField),
        companyName: getFieldValue(companyNameField),
        companyUrl,
        message: getFieldValue(messageField)
      };
    }

    function isCurrentEnrichmentRequest(requestId, controller, snapshot) {
      return (
        formState.enrichmentRequestId === requestId &&
        formState.enrichmentController === controller &&
        formState.currentPage === 2 &&
        snapshot.email === getFieldValue(emailField) &&
        snapshot.companyName === getFieldValue(companyNameField) &&
        snapshot.companyUrl === getWebsiteUrl(getFieldValue(websiteField)) &&
        snapshot.message === getFieldValue(messageField)
      );
    }

    // 5. State / UI functions
    function setFormMessage(message, isError = false) {
      if (!formMessage) return;

      formMessage.textContent = message;
      formMessage.classList.toggle("form__message--error", isError);
    }

    function isPrimaryReady() {
      if (formState.currentPage === 1) {
        return Boolean(emailField && isValidEmail(emailField.value));
      }

      if (formState.currentPage === 2) {
        return hasVerifiedFieldEntries();
      }

      return true;
    }

    function updateNavigationState() {
      if (backButton) {
        backButton.hidden = formState.currentPage !== 2;
        backButton.disabled = formState.isEnrichmentLoading;
      }

      if (formActions) {
        formActions.classList.toggle("is-final", formState.currentPage === 3);
      }

      if (!verifyButton) return;

      if (!verifyButton.disabled) {
        verifyButton.textContent = formState.currentPage === 3 ? "Submit Inquiry" : "Continue";
      }

      verifyButton.classList.toggle("button--ready", isPrimaryReady());
      verifyButton.setAttribute("aria-expanded", String(formState.currentPage > 1));
    }

    function updateProgress() {
      progressSteps.forEach((step) => {
        const stepNumber = Number(step.dataset.progressStep);
        const marker = step.querySelector(".progress__marker");
        const isComplete = stepNumber < formState.currentPage;
        const isCurrent = stepNumber === formState.currentPage;

        step.classList.toggle("is-complete", isComplete);

        if (isCurrent) {
          step.setAttribute("aria-current", "step");
        } else {
          step.removeAttribute("aria-current");
        }

        if (!marker) return;

        if (isComplete) {
          marker.replaceChildren(createIcon(["M5 12.5l4 4L19 7"]));
          return;
        }

        marker.textContent = String(stepNumber);
      });
    }

    function showPage(pageNumber) {
      formState.currentPage = pageNumber;

      if (form) {
        form.classList.toggle("form--inquiry", pageNumber === 1);
      }

      if (pageOne) {
        pageOne.hidden = pageNumber === 2;
      }

      if (verifiedFields) {
        verifiedFields.hidden = pageNumber === 1;
      }

      if (enrichedFields) {
        enrichedFields.hidden = pageNumber !== 3;
      }

      placeFormMessage(pageNumber);

      reviewTitles.forEach((title) => {
        title.hidden = pageNumber !== 3;
      });

      updateProgress();
      updateNavigationState();
    }

    function placeFormMessage(pageNumber) {
      if (!formMessage || !pageOne) return;

      const hiddenTitle = enrichedFields?.querySelector(".form__section-title");

      if (pageNumber === 3 && hiddenTitle) {
        hiddenTitle.after(formMessage);
        return;
      }

      pageOne.after(formMessage);
    }

    function clearEnrichmentFields() {
      if (enrichedFields) {
        enrichedFields.hidden = true;
      }

      RESET_FIELD_NAMES.forEach((name) => {
        const field = FIELD_CONFIG[name].field;

        if (field) {
          field.value = "";
        }
      });
    }

    function hideVerifiedFields() {
      if (verifiedFields) {
        verifiedFields.hidden = true;
      }

      clearEnrichmentFields();
      showPage(1);
    }

    function resetValidationFeedback() {
      if (validationIcon) {
        validationIcon.hidden = true;
        validationIcon.replaceChildren();
      }

      if (emailField) {
        emailField.setAttribute("aria-invalid", "false");
      }

      if (validationStatus) {
        validationStatus.textContent = "";
      }
    }

    function populateVerifiedFields() {
      if (
        !emailField ||
        !firstNameField ||
        !lastNameField ||
        !websiteField ||
        !companyNameField ||
        !verifiedFields ||
        !verifyButton
      ) {
        return;
      }

      const emailParts = getEmailParts(emailField.value);
      const nameParts = getNameParts(emailParts.localPart);

      firstNameField.value = nameParts.firstName;
      lastNameField.value = nameParts.lastName;
      websiteField.value = emailParts.domain;
      companyNameField.value = getCompanyName(emailParts.domain);
      updateFieldStatuses();
      updateVerifiedButtonState();
    }

    function updateEmailValidation() {
      if (!emailField || !validationStatus) return;

      const isValid = isValidEmail(emailField.value);

      emailField.setAttribute("aria-invalid", String(!isValid));
      validationStatus.textContent = isValid
        ? "Email address looks valid."
        : "Enter a valid email address.";

      if (isValid) {
        populateVerifiedFields();
      } else {
        hideVerifiedFields();
      }
    }

    function setVerifyLoading(isLoading) {
      formState.isEnrichmentLoading = isLoading;

      if (backButton) {
        backButton.disabled = isLoading;
      }

      if (!verifyButton) return;

      verifyButton.disabled = isLoading;
      verifyButton.textContent = isLoading ? "One moment..." : "Continue";

      if (!isLoading) {
        updateNavigationState();
      }
    }

    function cancelEnrichmentRequest() {
      formState.enrichmentRequestId += 1;

      if (formState.enrichmentController) {
        formState.enrichmentController.abort();
        formState.enrichmentController = null;
      }

      if (formState.isEnrichmentLoading) {
        setVerifyLoading(false);
      }
    }

    function getEnrichmentResult(result) {
      if (!result || typeof result !== "object" || Array.isArray(result)) {
        throw new Error("Company enrichment returned an invalid response.");
      }

      return ENRICHMENT_FIELD_NAMES.reduce((enrichment, name) => {
        const value = result[name];

        if (typeof value !== "string") {
          throw new Error("Company enrichment returned an invalid response.");
        }

        enrichment[name] = value;
        return enrichment;
      }, {});
    }

    function applyEnrichmentResult(result) {
      ENRICHMENT_FIELD_NAMES.forEach((name) => {
        const field = FIELD_CONFIG[name].field;

        if (field) {
          field.value = result[name];
        }
      });
    }

    async function enrichCompanyDetails() {
      if (
        !websiteField ||
        !industryField ||
        !aboutField ||
        !urgencyField ||
        !sentimentField ||
        !queryField ||
        !enrichedFields
      ) {
        return;
      }

      const companyUrl = getWebsiteUrl(getFieldValue(websiteField));

      if (!companyUrl) {
        setFormMessage("Enter a company website before verifying company details.", true);
        return false;
      }

      const snapshot = getEnrichmentSnapshot(companyUrl);
      const requestId = ++formState.enrichmentRequestId;
      const controller = new AbortController();
      const timeoutId = window.setTimeout(
        () => controller.abort(),
        COMPANY_ENRICHMENT_TIMEOUT_MS
      );

      formState.enrichmentController = controller;
      setVerifyLoading(true);
      setFormMessage("");

      try {
        const response = await fetch(COMPANY_ENRICHMENT_ENDPOINT, {
          method: "POST",
          signal: controller.signal,
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            companyUrl: snapshot.companyUrl,
            message: snapshot.message
          })
        });

        const result = await response.json();

        if (!isCurrentEnrichmentRequest(requestId, controller, snapshot)) {
          return null;
        }

        if (!response.ok) {
          throw new Error(result.error || "Company enrichment failed.");
        }

        applyEnrichmentResult(getEnrichmentResult(result));
        updateFieldStatuses();
        setFormMessage("Company details verified.");
        return true;
      } catch (error) {
        if (!isCurrentEnrichmentRequest(requestId, controller, snapshot)) {
          return null;
        }

        const message = error instanceof TypeError
          ? "Company enrichment proxy is not running."
          : error?.name === "AbortError"
            ? "Company enrichment timed out. Please try again."
          : error?.message || "Company enrichment failed.";

        setFormMessage(message, true);
        return false;
      } finally {
        window.clearTimeout(timeoutId);

        if (formState.enrichmentController === controller) {
          formState.enrichmentController = null;
          setVerifyLoading(false);
        }
      }
    }

    function updateVerifyButtonState() {
      if (!emailField || !verifyButton) return;

      cancelEnrichmentRequest();
      verifyButton.classList.toggle("button--ready", isValidEmail(emailField.value));
      updateFieldStatuses();
      resetValidationFeedback();
      hideVerifiedFields();
      setFormMessage("");
    }

    function updateVerifiedButtonState() {
      if (!verifyButton) return;

      updateFieldStatuses();
      updateNavigationState();
    }

    function handleVerifiedFieldInput() {
      cancelEnrichmentRequest();
      updateVerifiedButtonState();
    }

    async function handlePrimaryAction() {
      if (formState.currentPage === 3) {
        setFormMessage("Inquiry submitted.");
        return;
      }

      if (formState.currentPage === 2) {
        if (!hasVerifiedFieldEntries()) {
          setFormMessage("Enter first name, last name, website, and company name before continuing.", true);
          return;
        }

        const didEnrich = await enrichCompanyDetails();

        if (didEnrich === null) {
          return;
        }

        showPage(3);

        if (didEnrich) {
          setFormMessage("");
        }

        return;
      }

      updateEmailValidation();

      if (!emailField || !isValidEmail(emailField.value)) {
        setFormMessage("Enter a valid email address.", true);
        return;
      }

      showPage(2);
      setFormMessage("");
    }

    function handleBack() {
      if (formState.isEnrichmentLoading) {
        return;
      }

      if (formState.currentPage === 3) {
        showPage(2);
        setFormMessage("");
        return;
      }

      showPage(1);
      setFormMessage("");
    }

    // 7. Event listeners
    if (emailField) {
      emailField.addEventListener("input", updateVerifyButtonState);
    }

    if (messageField) {
      messageField.addEventListener("input", updateFieldStatuses);
    }

    DETAIL_FIELDS.forEach((field) => {
        field.addEventListener("input", handleVerifiedFieldInput);
    });

    if (backButton) {
      backButton.addEventListener("click", handleBack);
    }

    if (verifyButton) {
      verifyButton.addEventListener("click", handlePrimaryAction);
    }

    updateFieldStatuses();
    showPage(1);
  </script>
</body>
</html>
